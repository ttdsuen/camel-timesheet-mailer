# Two secrets are created out-of-band; neither is committed to git.
#
#   1. gitea-regcred  — pull credential for the private Gitea registry (referenced by
#      the Deployment's imagePullSecrets). Create it from your registry login instead of
#      from a manifest, so the encoded password stays out of version control:
#
#        kubectl -n timesheet-mailer create secret docker-registry gitea-regcred \
#          --docker-server=gitea.home.net \
#          --docker-username="$REGISTRY_USERNAME" \
#          --docker-password="$REGISTRY_PASSWORD"
#
#   2. timesheet-mail-secrets — SMTP credentials, consumed via envFrom. Copy the YAML
#      below to a private secret.yaml, fill in real values, and apply it:
#
#        kubectl -n timesheet-mailer apply -f secret.yaml
#
# For Gmail, MAIL_PASSWORD is an App Password (not your account password): enable
# 2-Step Verification, then create one at https://myaccount.google.com/apppasswords
apiVersion: v1
kind: Secret
metadata:
  name: timesheet-mail-secrets
  namespace: timesheet-mailer
type: Opaque
stringData:
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "you@gmail.com"
  MAIL_PASSWORD: "REPLACE_ME"
